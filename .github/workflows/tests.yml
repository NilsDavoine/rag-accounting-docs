name: tests

on:
  push:
  pull_request:

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  fast:
    name: unit tests (no database, no model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: The generators reproduce the committed corpora byte for byte
        run: |
          python -m data.generate_corpus
          python -m data.generate_hard
          git diff --exit-code
      - run: python -m pytest -m "not db"

  isolation:
    name: tenant isolation (PostgreSQL + pgvector, real models)
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache the two pinned models (about 1 GB, downloaded once)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('rag/config.py') }}
      - name: Build both indexes
        run: |
          python -m rag.index
          python -m rag.index --hard
      - run: python -m pytest -m db
